name: Sayt nazorati

# Har 30 daqiqada (va qo'lda): burgersmash.uz va /ru/ ochiladimi.
# Ochilmasa 1 daqiqadan keyin qayta tekshiriladi; yana ochilmasa — Telegram'ga «🔴» va workflow qizil.
# Xabarlar faqat holat o'zgarganda: sayt tuzalmaguncha «🔴» qayta yozilmaydi, tuzalganda bir marta «🟢».
# Oldingi holat — shu workflow'ning oldingi tugagan ishga tushishi (qizil = sayt ochilmagan).
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: sayt-nazorati
  cancel-in-progress: false

env:
  SAYT_URL: ${{ vars.SAYT_URL || 'https://burgersmash.uz' }}
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  TEKSHIRUV_URINISH: '1'
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  nazorat:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Oldingi holat
        id: oldingi
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          holat=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow sayt-nazorati.yml --status completed --limit 20 \
            --json databaseId,conclusion \
            --jq "[.[] | select(.databaseId != $GITHUB_RUN_ID and (.conclusion == \"success\" or .conclusion == \"failure\"))][0].conclusion // \"\"" \
            || echo "")
          echo "Oldingi holat: ${holat:-topilmadi}"
          echo "holat=$holat" >> "$GITHUB_OUTPUT"

      - name: Tekshirish
        id: t1
        continue-on-error: true
        run: node scripts/sayt-tekshir.js

      - name: 1 daqiqa kutish
        if: steps.t1.outcome == 'failure'
        run: sleep 60

      - name: Qayta tekshirish
        id: t2
        if: steps.t1.outcome == 'failure'
        continue-on-error: true
        run: node scripts/sayt-tekshir.js

      - name: "Telegram: sayt ochilmayapti"
        if: steps.t2.outcome == 'failure' && steps.oldingi.outputs.holat != 'failure'
        env:
          SABAB: ${{ steps.t2.outputs.sabab }}
        run: |
          node scripts/telegram.js "🔴 Sayt ochilmayapti
          Sabab: $SABAB
          $RUN_URL"

      - name: "Telegram: sayt yana ishlayapti"
        if: steps.t2.outcome != 'failure' && steps.oldingi.outputs.holat == 'failure'
        run: node scripts/telegram.js "🟢 Sayt yana ishlayapti"

      - name: Natija
        if: steps.t2.outcome == 'failure'
        run: |
          echo "::error::Sayt ochilmayapti"
          exit 1
