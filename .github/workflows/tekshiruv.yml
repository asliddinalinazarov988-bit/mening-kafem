name: Tekshiruv

# Har PR'da va main'ga har push'da npm test. «Avtomatik Merj» ham shu workflow'ni chaqiradi.
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
    inputs:
      ref:
        description: Tekshiriladigan commit (bo'sh bo'lsa — hodisaning o'zi)
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  test:
    name: npm test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Testlarga paket kerak emas (baza va Telegram soxta) — npm install qilinmaydi.
      - run: npm test
